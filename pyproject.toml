[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotdata-langchain"
version = "0.1.2"
description = "LangChain tools for Hotdata runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "hotdata-runtime>=0.2.4",
  "hotdata>=0.2.6",
  "langchain-core>=0.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["hotdata_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
