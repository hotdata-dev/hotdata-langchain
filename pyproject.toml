[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotdata-langchain"
version = "0.7.0"
description = "LangChain tools for Hotdata runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "hotdata-framework>=0.10.0",
  "hotdata>=0.8.0",
  "langchain-core>=1.0",
  "numpy>=1.26",
  "pyarrow>=15",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.5",
  "langchain-tests>=1.0",
]
demo = [
  "langchain>=1.0",
  "langchain-openai>=1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["hotdata_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "DTZ", "T20", "RET", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201", "E501"]
"demo/**/*.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["hotdata_langchain", "tests"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_reexport = false
implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
strict_bytes = true
extra_checks = true

# pyarrow resolves to Any under mypy: its __init__.pyi re-exports from an untyped C
# extension, so every pa.* annotation trips disallow_any_unimported and every
# pq.* call trips disallow_untyped_calls. Scoped to the two modules that touch it.
[[tool.mypy.overrides]]
module = ["hotdata_langchain.vectorstore", "tests.fake_hotdata"]
disallow_any_unimported = false
disallow_untyped_calls = false
